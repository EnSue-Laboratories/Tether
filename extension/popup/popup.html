<!doctype html>
<!-- Tether popup — monochrome JetBrains Mono devtool aesthetic (v3.6 design,
     design owner @kira-pgr, see thread #Agents:ab6f8be6 / PR #X).
     Existing TabState (daemonConnected / url / capturing / sessionId /
     consoleCount / networkCount) drives the UI; event-list streaming is a
     follow-up — for now the body shows status, channel selector, and counts. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
      <header class="header">
        <div class="brand">TETHER</div>
        <button
          id="capture-toggle"
          class="capture-toggle"
          role="switch"
          aria-checked="false"
          aria-label="Toggle capture for this tab"
        >
          <span class="capture-toggle-label">CAPTURE</span>
          <span class="toggle-track"><span class="toggle-knob"></span></span>
        </button>
      </header>

      <div class="controls-bar">
        <div class="channel-toggle" role="tablist" aria-label="Event channel">
          <button
            id="channel-network"
            class="channel-btn"
            role="tab"
            aria-selected="true"
            data-channel="network"
          >Network</button>
          <button
            id="channel-console"
            class="channel-btn"
            role="tab"
            aria-selected="false"
            data-channel="console"
          >Console</button>
        </div>
      </div>

      <div id="content" class="content">
        <div id="empty-state" class="empty-state">
          <div id="empty-title" class="empty-state-title">— No capture in progress</div>
          <div class="empty-state-hint">
            Toggle CAPTURE on above to start recording this tab.
            Live event details are available via the
            <code>tether console</code> / <code>tether net</code> CLI.
          </div>
        </div>
        <div class="guide-line"></div>
        <div class="guide-line"></div>
        <div class="guide-line"></div>
      </div>

      <footer class="footer">
        <div class="status-metrics">
          <button
            id="filter-all"
            class="metric-box"
            aria-pressed="true"
            aria-label="Show all events"
          >
            <span class="metric-label" id="metric-all-label">REQ</span>
            <span class="metric-value" id="metric-all-count">0</span>
          </button>
          <button
            id="filter-err"
            class="metric-box"
            aria-pressed="false"
            aria-label="Filter to errors only"
          >
            <span class="metric-label">ERR</span>
            <span class="metric-value" id="metric-err-count">0</span>
          </button>
        </div>
        <div id="agent-status" class="agent-status paused">
          <span id="agent-status-label">Paused</span>
          <div class="pulse-dot"></div>
        </div>
      </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
